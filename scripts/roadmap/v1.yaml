# ADR RULES THAT SHIPPED AND ARE WRONG
#
# Not done-line promises, so they are not numbered above and not in the 29.
# They are here because they are the only promises in the record that shipped
# code actively fails, and nothing else surfaces them.
# =============================================================================

adr_failures:

  - id: f1
    state: not_met
    adrs: []
    rule: >-
      A player build does not honour a measurement control even when it is typed
      by hand.
    short: "A player build ignores the dev switches"
    note: >-
      There is one build script and no second flavour, so anybody on the
      deployed URL who types *?levels=* or *?size=* gets it. ADR 0022 names this
      exact failure and says calling a control dev-only is not sufficient. The
      instrument routes are reachable the same way. Ticket #66.
    evidence: >-
      There is one build script and no flavour define, so ?levels= and ?size=
      are both live on the deployed URL, which is the exact failure ADR 0022
      calls out when it says declaring a control dev-only is not sufficient. The
      instrument routes for replay and runs are reachable the same way.
    tickets: [66]

  - id: f4
    state: not_met
    adrs: []
    rule: "The four weapon-line motions never blur."
    short: "The four motions never blur"
    note: >-
      All four are shipped and distinct in the code, and your own play found the
      soul stream and the wisps getting lost in each other. The renderer's own
      comment says no test can see this rule, so only a person looking can close
      it. Rides inside the tuning pass, #39. One named piece of it, the soul
      stream reading as a diagonal rather than as straight streams, was closed
      by #79's mounted streams, accepted in play.
    evidence: >-
      All four are shipped and distinct in code, but Mark's play on 2026-08-23
      found the soul stream and the wisps get lost in each other. The renderer's
      own comment records that no test can see this rule, so only a person
      looking can close it.
    ruling: >-
      Ruled by Mark on 2026-08-25: this rides inside the tuning pass rather than
      getting its own ticket.
    tickets: [39]

