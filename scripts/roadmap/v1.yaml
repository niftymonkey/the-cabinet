# =============================================================================
# THE V1 SOURCE
#
# This file is the one place the V1 picture is written down. Everything else
# (the Road to V1 page, any status list, any prompt handed to another agent) is
# an OUTPUT built from this file. Change a fact
# here and rebuild the output. Never edit an output directly, and never let
# a fact live in two places.
#
# The intended reader is a language model. It is written to be read straight
# through and turned into something else without guessing.
#
# -----------------------------------------------------------------------------
# THE FOUR STATES
#
#   kept     Built and working, and something holds it there: a test, a check,
#            or a person who looked.
#   part     Some of it is real and a NAMED piece is not. Never a guess. Every
#            "part" entry says which half is which.
#   open     None of it is true yet. Some cannot even be attempted, because the
#            thing they describe does not exist.
#   not_met  Shipped, and does not do what it promised. Worse than not started,
#            and different from untuned. This state exists because without it a
#            live production leak and a broken sim rule both stayed invisible.
#
# -----------------------------------------------------------------------------
# WHERE THE PROMISES COME FROM, AND THE COUNTING TRAP
#
# Three written sources. 29 promises total.
#
#   box  docs/design/game-concept.md, the section titled "The box".   14
#   s1   docs/design/tracer-plan.md, section 1.                       14
#   s7   docs/design/tracer-plan.md, section 7, the never-cut list.     1
#
# The trap: three sessions produced three different totals for the same
# question. Section 7's never-cut list has FOUR items, but three of them (the
# phone fit, cross-device determinism, the readability rules) restate promises
# already counted under box or s1. Counting them again inflates the total. Only
# the art pass appears nowhere else, which is why s7 contributes exactly 1.
#
# Every promise carries `sources` (all the places it is written) and `primary`
# (the one section it is COUNTED under). Count with `primary`. Never count with
# `sources`.
#
# About seventy further obligations sit underneath these promises in docs/adr/.
# They are real and they are deliberately not copied here, because a copy would
# drift from the ADRs. The only exception is `adr_failures` below: ADR rules
# that shipped and are wrong, recorded here because nothing else surfaces them.
#
# -----------------------------------------------------------------------------
# WHAT NEVER GOES IN THIS FILE
#
#   - Whether a ticket is open or closed. The tracker owns that. A copy here
#     could quietly contradict it. Read it live from `gh` if an output needs it.
#   - Page prose: headings, intro paragraphs, design copy. That is writing, not
#     data, and it belongs in the template that builds the output.
#   - Anything a tool can derive. Counts are here only as a self-check.
#
# -----------------------------------------------------------------------------
# WHEN THIS FILE CHANGES
#
# Four events only: a ticket closes, a ruling lands, a measurement arrives, or
# somebody plays the game. Nearly every mark here is a judgement no generator
# can derive, and a stale judgement is something a person notices.
#
# -----------------------------------------------------------------------------
# HOW TO BUILD AN OUTPUT FROM THIS FILE
#
#   1. Read the whole file first. Do not build from a section in isolation.
#   2. Check your work against `tally`. If your counts disagree with it, you
#      have dropped or double-counted something. Fix it before writing.
#   3. Keep the `id` fields. The published page uses them as element ids and
#      the relationship arrows are drawn between them. Changing an id breaks
#      the arrows.
#   4. Never invent a relationship. `blocked_by` is the complete set of edges.
#      If two cards look related and no edge is written here, there is no edge.
#   5. Text may carry exactly two marks, and nothing else is markup:
#        *emphasis*  becomes bold
#        //          becomes a line break
#      Everything else is escaped, so a stray < or & is safe.
#   6. `short` and `gloss` are the compact display pair for a small card.
#      `clause` and `evidence` are the full statement for a document. Pick the
#      pair that fits the output; do not mix one of each.
#   7. Build ticket links as ticket_url_base + the number.
#
# =============================================================================

meta:
  ticket_url_base: "https://github.com/niftymonkey/the-cabinet/issues/"
  v1_in_one_line: "one stage, a final boss,//played on desktop and phone"

# =============================================================================
# OUTPUTS
#
# Every artifact published from this file. One entry per output, keyed by the
# name the build script knows it as. An artifact keeps its URL forever, so
# republishing the same output MUST reuse its url. A new key means a new URL.
#
# Nothing outside a Claude Code session can publish: there is no CLI and no
# write API for artifacts, only the Artifact tool. So a build writes the HTML
# and a session publishes it.
# =============================================================================

outputs:
  road_to_v1:
    title: "Road to V1"
    brand_suffix: "The Hungry Grave"
    favicon: "🗺️"
    description: >-
      The V1 roadmap for The Hungry Grave: what is left to build, how far the
      twenty-nine promises are, and what nobody knows yet.
    url: "https://claude.ai/code/artifact/c6bc397f-f700-49cc-914f-5ed88f2cb420"
    template: "scripts/roadmap/v1-page.template.html"
    out: "scripts/roadmap/build/road-to-v1.html"

# A self-check for anything that rebuilds this. Not a source of truth.
tally:
  promises_total: 29
  by_state: { kept: 17, part: 10, open: 2 }
  by_primary: { box: 14, s1: 14, s7: 1 }
  adr_failures: 2
  work_cards: 15
  fog_items: 12

# The display wording for each state, when an output shows a key or legend.
states:
  kept:
    label: "Kept"
    blurb: >-
      True in the build today, and something holds it there: a test, a check,
      or a person who looked.
  part:
    label: "Part"
    blurb: >-
      Some of it is true and a named piece is not. Never a guess: each one says
      which piece is missing.
  open:
    label: "Open"
    blurb: >-
      None of it is true yet. Some cannot even be attempted, because the thing
      they describe does not exist.
  not_met:
    label: "Not met"
    blurb: >-
      Shipped, and does not do what it promised. Worse than not started, and
      different from untuned.

sources:
  box:
    file: "docs/design/game-concept.md"
    section: "The box"
    heading: "What V1 is"
    caption: "the v1 box"
  s1:
    file: "docs/design/tracer-plan.md"
    section: "1"
    heading: "What the build has to show"
    caption: "tracer plan section 1"
  s7:
    file: "docs/design/tracer-plan.md"
    section: "7, the never-cut list"
    heading: "Promised out loud, never cut"
    caption: "tracer plan section 7"
    footnote: >-
      The never-cut list has four items. The other three, the phone fit, the
      cross-device determinism work and the readability rules, are the same
      promises already counted above, so counting them again here would inflate
      the total. The list is a priority statement over promises that already
      exist, and the art pass is the only thing on it that appears nowhere else.

