# =============================================================================
# ALREADY BUILT AND MERGED
# =============================================================================

built:
  - title: "The game plays, start to finish"
    note: >-
      Three mob types, four weapon lines, drops and the belch. Plays in a
      desktop browser and under thumbs on a phone.
    source: "tracer dispatches 1 to 5"

  - title: "Drops say which line they upgrade"
    note: >-
      Each drop carries its weapon line's silhouette and separates from the
      field without a HUD glance. Played on the live build and accepted.
    source: "ticket #36"

  - title: "Every run is recorded and can be replayed"
    note: >-
      Every run writes a tape that proves it is the real run. Watch one back
      and measure it from a developer screen; players cannot reach it yet.
    source: "ticket #45"

  - title: "Four bugs closed"
    note: >-
      A run that kept simulating after it ended, bad numbers reaching a mob's
      position, thumb steering on iPad and phone, and one that caught the rest.
    source: "tickets #52, #53, #54, #33"

  - title: "The code fits the verified rules"
    note: >-
      Eleven refactor phases over 259 files, with the fingerprint, screenshots
      and Mark's own play saying nothing a player sees changed.
    source: "ticket #59, PR #70"

  - title: "The tool can answer a tuning question"
    note: >-
      A recorded run now reports cost, pace, the grave's path, field share,
      freshness, belch cadence and drop landings, and two runs compare without
      hand arithmetic.
    source: "tickets #73, #74, PR #75"

  - title: "The drop band was judged, and it holds"
    note: >-
      Seven recorded runs landed inside the ruled ten-to-twelve drop band, on
      touch and on keyboard alike.
    source: "ticket #60"

  - title: "The first weapon pool is settled"
    note: >-
      Four lines that each own a job: pressure, pursuit, repel, and Territory.
      Mark played it and said it plays well.
    source: "ticket #76, PR #78"

  - title: "How power arrives"
    note: >-
      You start with one weapon, each run rolls its own set, weapons level up
      from fresh corpses, and a power-up is a choice of three carried by
      specific enemies.
    source: "PR #147, step 1"

  - title: "The stage, with two real bosses"
    note: >-
      Three sections with their own feel, two bosses in phases, the eye that
      opens mid-field and pours enemies, music and art per section.
    source: "PR #147, step 2"

  - title: "The computer player"
    note: >-
      A bot plays many runs fast with no screen, records each one, and reports
      the numbers, with sharp and sloppy hands to compare.
    source: "PR #147, step 3"

  - title: "How enemies arrive"
    note: >-
      Weak enemies in big crowds, power earned slower, a director that adds
      enemies when you are cruising, and the belch turned into a pushback that
      opens the Wall.
    source: "PR #147, step 4"

  - title: "Show what you have"
    note: >-
      Score and each weapon's level on screen, a lost level you can watch fall
      and dive to catch back, a capped score bleed at the floor, the play area
      laid out for phone and desktop, and the final score on the end screen.
    source: "PR #147, step 5"

  - title: "The tuning tool"
    note: >-
      Balance settings live in one record carried by each run and saved in
      every recording, a named set plays by bot or by URL, and one command
      sweeps two sets and prints what differed. No balance value moved yet.
    source: "PR #147, step 6"

  - title: "ADRs condensed, and old tapes retired"
    note: >-
      The 64 ADRs became 16, with a README mapping every retired number. The
      tape format moved to version 5; recordings from before it no longer
      replay.
    source: "PR #147"

# =============================================================================
# THE FOG: WHAT NOBODY KNOWS YET
#
# Grouped by the kind of thing that would settle each one. None of this has been
# turned into work by guessing.
#
# `home.kind` says how the unknown is held:
#   ticket    it has a ticket of its own
#   inside    it is carried inside other work
#   waits_on  it cannot move until something else happens
# =============================================================================

fog_groups:

  - key: measurement
    heading: "Needs a measurement"
    items:

      - title: "Is the build too easy now?"
        note: >-
          Your read after two plays, and the one v1 promise that was ruled
          ungaugeable rather than met. It cannot be answered by another play
          while both bosses are stubs and every tape ends in the same victory.
          The tuning loop answers it, over damage taken, damage dealt, time to
          kill and belch growth.
        home: { kind: inside, text: "the tuning pass #39; the levelled-player half is now #85" }

      - title: "How dense does the tuned field actually get?"
        note: >-
          Produced rather than assumed, and it does not exist. Until it does,
          the grayscale rule has no number to be checked at.
        home: { kind: inside, text: "the tuning pass" }

  - key: play
    heading: "Needs somebody to play it"
    items:

      - title: "The central bet: delicious or miserable?"
        note: >-
          Steering into where danger just was, against every shmup instinct. The
          one thing the project exists to test.
        home: { kind: inside, text: "#31, and only #31" }

      - title: "After a bad hit: comeback or spiral?"
        note: >-
          The answer differs above the size floor and at it, so one averaged
          number describes neither.
        home: { kind: inside, text: "a recorded read from the finished build" }

      - title: "One belch against the boss: enough?"
        note: >-
          A named v1 criterion. The boss now exists, but no fresh run currently
          beats it, so it waits on the tuning round before it can be played.
        home: { kind: inside, text: "the tuning pass #39, then play" }

      - title: "Is Territory too weak in the first minutes?"
        note: >-
          Your read after the first play was "fine-ish, a good direction", and
          you wanted more plays before ruling. Level 1 is the only rung an
          ordinary mob survives, by the shape of the thing rather than by
          choice.
        home: { kind: inside, text: "more plays on the tuned build" }

  - key: decision
    heading: "Needs a decision"
    items:

      - title: "Drops under corpses: push them apart, or draw them on top?"
        note: >-
          A force fixes seeing them and reaching them, and costs sim work. Draw
          order costs one line and fixes only seeing them. The weight and breath
          the drops now carry may have settled it already, which is why it waits
          on somebody playing rather than on a decision.
        home: { kind: inside, text: "#31" }

      - title: 'Does "food" survive as the umbrella term?'
        note: >-
          An open modelling question, and its answer decides how large a rename
          gets. It was homed at #59, which never touched it, so #59 closing
          leaves it with no owner.
        home: { kind: waits_on, text: "a modelling round; no ticket owns it" }

      - title: "How the two build flavours get built"
        note: >-
          Vite's mode flag is the standing candidate and nothing is chosen. The
          promise now has a ticket; the mechanism is still open.
        home: { kind: inside, text: "#66" }

      - title: "Do the weapon lines have named roles, and is that an ADR?"
        note: >-
          The pool review named four: my lane, anywhere, around me at field
          scale, ahead of me. It decides what a fifth line would have to be, and
          it is written down nowhere a build can see.
        home: { kind: waits_on, text: "a ruling; no ticket owns it" }

  - key: waiting
    heading: "Waiting on something else"
    items:

      - title: >-
          Is the five minute stage the whole of V1, and does V1 ship difficulty
          modes?
        note: >-
          The count on a row is already the knob, so a mode is a data question
          rather than a build.
        home: { kind: waits_on, text: "what #31 says" }

      - title: "Nobody has seen the refusal screen with human eyes"
        note: >-
          The path is tested and has never been watched. A deliberately faulted
          run in a dev browser is the cheap look.
        home: { kind: waits_on, text: "five minutes, whenever" }

