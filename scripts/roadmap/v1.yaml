# =============================================================================
# THE FOG: WHAT NOBODY KNOWS YET
#
# Grouped by the kind of thing that would settle each one. None of this has been
# turned into work by guessing.
#
# `home.kind` says how the unknown is held:
#   ticket    it has a ticket of its own
#   inside    it is carried inside other work
#   waits_on  it cannot move until something else happens
# =============================================================================

fog_groups:

  - key: find_out
    heading: "Needs somebody to go and find out"
    how: >-
      Both have criteria and no design. These are the two I would put a
      Wayfinder on.
    emphasis: true
    items:

      - title: "What the Halloween look actually is"
        note: >-
          Pumpkin hue is banned, brown and AI purple are banned, the brightness
          budget is spent, and hue is already carrying drops and corpses. Very
          little is left to say Halloween with, and the palette test is blind to
          textures.
        home: { kind: ticket, text: "#38" }

      - title: "What the real audio is, and whether it is in V1"
        note: >-
          Nothing says whether the sounds get made, bought or licensed, or how
          eight distinct moments stay tellable by ear when several land at once.
          And no ruling ever put audio inside the v1 done-line.
        home: { kind: ticket, text: "#47, and the scope ruling is now #67" }

  - key: measurement
    heading: "Needs a measurement"
    items:

      - title: "Is the build too easy now?"
        note: >-
          Your read after two plays, and the one v1 promise that was ruled
          ungaugeable rather than met. It cannot be answered by another play
          while both bosses are stubs and every tape ends in the same victory.
          The tuning loop answers it, over damage taken, damage dealt, time to
          kill and belch growth.
        home: { kind: inside, text: "the tuning pass, #39" }

      - title: "How dense does the tuned field actually get?"
        note: >-
          Produced rather than assumed, and it does not exist. Until it does,
          the grayscale rule has no number to be checked at.
        home: { kind: inside, text: "the tuning pass" }

  - key: play
    heading: "Needs somebody to play it"
    items:

      - title: "The central bet: delicious or miserable?"
        note: >-
          Steering into where danger just was, against every shmup instinct. The
          one thing the project exists to test.
        home: { kind: inside, text: "#31, and only #31" }

      - title: "After a bad hit: comeback or spiral?"
        note: >-
          The answer differs above the size floor and at it, so one averaged
          number describes neither.
        home: { kind: inside, text: "a recorded read from the finished build" }

      - title: "One belch against the boss: enough?"
        note: >-
          A named v1 criterion that cannot be asked until a boss exists to ask it
          about.
        home: { kind: inside, text: "the boss work, then play" }

      - title: "Is Territory too weak in the first minutes?"
        note: >-
          Your read after the first play was "fine-ish, a good direction", and
          you wanted more plays before ruling. Level 1 is the only rung an
          ordinary mob survives, by the shape of the thing rather than by
          choice.
        home: { kind: inside, text: "more plays on the tuned build" }

  - key: decision
    heading: "Needs a decision"
    items:

      - title: "Drops under corpses: push them apart, or draw them on top?"
        note: >-
          A force fixes seeing them and reaching them, and costs sim work. Draw
          order costs one line and fixes only seeing them. The weight and breath
          the drops now carry may have settled it already, which is why it waits
          on somebody playing rather than on a decision.
        home: { kind: inside, text: "#31" }

      - title: "Does the field get its own ground fill?"
        note: >-
          If it does, the frame colour and its heavy stroke can come down, which
          buys room the art pass badly needs.
        home: { kind: inside, text: "#38" }

      - title: 'Does "food" survive as the umbrella term?'
        note: >-
          An open modelling question, and its answer decides how large a rename
          gets. It was homed at #59, which never touched it, so #59 closing
          leaves it with no owner.
        home: { kind: waits_on, text: "a modelling round; no ticket owns it" }

      - title: "How the two build flavours get built"
        note: >-
          Vite's mode flag is the standing candidate and nothing is chosen. The
          promise now has a ticket; the mechanism is still open.
        home: { kind: inside, text: "#66" }

      - title: "Along which axis does freshness shrink the burst?"
        note: >-
          The two on-swallow lines pay in different currencies: the stream pays
          as a surge, the wisps as a count of souls. The rule says the burst
          scales and never says along what, and picking wrong changes how the rot
          floor feels rather than just what it pays.
        home: { kind: inside, text: "#68, before any code" }

      - title: "Do the weapon lines have named roles, and is that an ADR?"
        note: >-
          The pool review named four: my lane, anywhere, around me at field
          scale, ahead of me. It decides what a fifth line would have to be, and
          it is written down nowhere a build can see.
        home: { kind: waits_on, text: "a ruling; no ticket owns it" }

  - key: waiting
    heading: "Waiting on something else"
    items:

      - title: >-
          Is the five minute stage the whole of V1, and does V1 ship difficulty
          modes?
        note: >-
          The count on a row is already the knob, so a mode is a data question
          rather than a build.
        home: { kind: waits_on, text: "what #31 says" }

      - title: "Nobody has seen the refusal screen with human eyes"
        note: >-
          The path is tested and has never been watched. A deliberately faulted
          run in a dev browser is the cheap look.
        home: { kind: waits_on, text: "five minutes, whenever" }

